<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="dup-title dup-desc"><title id="dup-title">Real Senate row and duplicate added only to a test copy</title><desc id="dup-desc">The original summary has unique ticker-month keys. The actual first row is repeated only for testing. The one-to-one merge raises a MergeError.</desc><rect width="1200" height="680" fill="#ffffff"/><g font-family="Arial, sans-serif" fill="#343a40"><text x="32" y="48" font-size="30" font-weight="700" fill="#343a40">See the duplicate the check rejects</text><text x="32" y="83" font-size="19" font-weight="400" fill="#343a40">One real summary row, copied only for the failure test. The source data stays unchanged.</text><text x="32" y="132" font-size="22" font-weight="700" fill="#343a40">1. Original Senate summary: one row for this key</text><rect x="32" y="150" width="246" height="36" fill="#f1f3f5" stroke="#dee2e6"/><text x="44" y="174" font-size="17" font-weight="700" fill="#343a40">Row origin</text><rect x="278" y="150" width="115" height="36" fill="#f1f3f5" stroke="#dee2e6"/><text x="290" y="174" font-size="17" font-weight="700" fill="#343a40">Ticker</text><rect x="393" y="150" width="155" height="36" fill="#f1f3f5" stroke="#dee2e6"/><text x="405" y="174" font-size="17" font-weight="700" fill="#343a40">Month</text><rect x="548" y="150" width="124" height="36" fill="#f1f3f5" stroke="#dee2e6"/><text x="560" y="174" font-size="17" font-weight="700" fill="#343a40">Reports</text><rect x="672" y="150" width="124" height="36" fill="#f1f3f5" stroke="#dee2e6"/><text x="684" y="174" font-size="17" font-weight="700" fill="#343a40">Filings</text><rect x="796" y="150" width="124" height="36" fill="#f1f3f5" stroke="#dee2e6"/><text x="808" y="174" font-size="17" font-weight="700" fill="#343a40">Filers</text><rect x="920" y="150" width="124" height="36" fill="#f1f3f5" stroke="#dee2e6"/><text x="932" y="174" font-size="17" font-weight="700" fill="#343a40">Purchases</text><rect x="1044" y="150" width="124" height="36" fill="#f1f3f5" stroke="#dee2e6"/><text x="1056" y="174" font-size="17" font-weight="700" fill="#343a40">Sales</text><rect x="32" y="186" width="246" height="44" fill="#ffffff" stroke="#dee2e6"/><text x="44" y="214" font-size="18" font-weight="400" fill="#343a40">Actual saved row</text><rect x="278" y="186" width="115" height="44" fill="#ffffff" stroke="#dee2e6"/><text x="290" y="214" font-size="18" font-weight="700" fill="#343a40">AAPL</text><rect x="393" y="186" width="155" height="44" fill="#ffffff" stroke="#dee2e6"/><text x="405" y="214" font-size="18" font-weight="700" fill="#343a40">2025-01</text><rect x="548" y="186" width="124" height="44" fill="#ffffff" stroke="#dee2e6"/><text x="560" y="214" font-size="18" font-weight="400" fill="#343a40">3</text><rect x="672" y="186" width="124" height="44" fill="#ffffff" stroke="#dee2e6"/><text x="684" y="214" font-size="18" font-weight="400" fill="#343a40">3</text><rect x="796" y="186" width="124" height="44" fill="#ffffff" stroke="#dee2e6"/><text x="808" y="214" font-size="18" font-weight="400" fill="#343a40">2</text><rect x="920" y="186" width="124" height="44" fill="#ffffff" stroke="#dee2e6"/><text x="932" y="214" font-size="18" font-weight="400" fill="#343a40">0</text><rect x="1044" y="186" width="124" height="44" fill="#ffffff" stroke="#dee2e6"/><text x="1056" y="214" font-size="18" font-weight="400" fill="#343a40">3</text><text x="32" y="289" font-size="22" font-weight="700" fill="#343a40">2. Test copy: the same row appears twice</text><rect x="32" y="310" width="246" height="36" fill="#f1f3f5" stroke="#dee2e6"/><text x="44" y="334" font-size="17" font-weight="700" fill="#343a40">Row origin</text><rect x="278" y="310" width="115" height="36" fill="#fff0d7" stroke="#dee2e6"/><text x="290" y="334" font-size="17" font-weight="700" fill="#343a40">Ticker</text><rect x="393" y="310" width="155" height="36" fill="#fff0d7" stroke="#dee2e6"/><text x="405" y="334" font-size="17" font-weight="700" fill="#343a40">Month</text><rect x="548" y="310" width="124" height="36" fill="#f1f3f5" stroke="#dee2e6"/><text x="560" y="334" font-size="17" font-weight="700" fill="#343a40">Reports</text><rect x="672" y="310" width="124" height="36" fill="#f1f3f5" stroke="#dee2e6"/><text x="684" y="334" font-size="17" font-weight="700" fill="#343a40">Filings</text><rect x="796" y="310" width="124" height="36" fill="#f1f3f5" stroke="#dee2e6"/><text x="808" y="334" font-size="17" font-weight="700" fill="#343a40">Filers</text><rect x="920" y="310" width="124" height="36" fill="#f1f3f5" stroke="#dee2e6"/><text x="932" y="334" font-size="17" font-weight="700" fill="#343a40">Purchases</text><rect x="1044" y="310" width="124" height="36" fill="#f1f3f5" stroke="#dee2e6"/><text x="1056" y="334" font-size="17" font-weight="700" fill="#343a40">Sales</text><rect x="32" y="346" width="246" height="44" fill="#ffffff" stroke="#dee2e6"/><text x="44" y="374" font-size="18" font-weight="400" fill="#343a40">Original row</text><rect x="278" y="346" width="115" height="44" fill="#fff0d7" stroke="#dee2e6"/><text x="290" y="374" font-size="18" font-weight="700" fill="#343a40">AAPL</text><rect x="393" y="346" width="155" height="44" fill="#fff0d7" stroke="#dee2e6"/><text x="405" y="374" font-size="18" font-weight="700" fill="#343a40">2025-01</text><rect x="548" y="346" width="124" height="44" fill="#ffffff" stroke="#dee2e6"/><text x="560" y="374" font-size="18" font-weight="400" fill="#343a40">3</text><rect x="672" y="346" width="124" height="44" fill="#ffffff" stroke="#dee2e6"/><text x="684" y="374" font-size="18" font-weight="400" fill="#343a40">3</text><rect x="796" y="346" width="124" height="44" fill="#ffffff" stroke="#dee2e6"/><text x="808" y="374" font-size="18" font-weight="400" fill="#343a40">2</text><rect x="920" y="346" width="124" height="44" fill="#ffffff" stroke="#dee2e6"/><text x="932" y="374" font-size="18" font-weight="400" fill="#343a40">0</text><rect x="1044" y="346" width="124" height="44" fill="#ffffff" stroke="#dee2e6"/><text x="1056" y="374" font-size="18" font-weight="400" fill="#343a40">3</text><rect x="32" y="390" width="246" height="44" fill="#ffffff" stroke="#dee2e6"/><text x="44" y="418" font-size="18" font-weight="400" fill="#343a40">Added copy (test only)</text><rect x="278" y="390" width="115" height="44" fill="#fff0d7" stroke="#dee2e6"/><text x="290" y="418" font-size="18" font-weight="700" fill="#343a40">AAPL</text><rect x="393" y="390" width="155" height="44" fill="#fff0d7" stroke="#dee2e6"/><text x="405" y="418" font-size="18" font-weight="700" fill="#343a40">2025-01</text><rect x="548" y="390" width="124" height="44" fill="#ffffff" stroke="#dee2e6"/><text x="560" y="418" font-size="18" font-weight="400" fill="#343a40">3</text><rect x="672" y="390" width="124" height="44" fill="#ffffff" stroke="#dee2e6"/><text x="684" y="418" font-size="18" font-weight="400" fill="#343a40">3</text><rect x="796" y="390" width="124" height="44" fill="#ffffff" stroke="#dee2e6"/><text x="808" y="418" font-size="18" font-weight="400" fill="#343a40">2</text><rect x="920" y="390" width="124" height="44" fill="#ffffff" stroke="#dee2e6"/><text x="932" y="418" font-size="18" font-weight="400" fill="#343a40">0</text><rect x="1044" y="390" width="124" height="44" fill="#ffffff" stroke="#dee2e6"/><text x="1056" y="418" font-size="18" font-weight="400" fill="#343a40">3</text><text x="32" y="463" font-size="19" font-weight="700" fill="#343a40">Repeated join key: AAPL + 2025-01. Both rows also carry the same reported counts.</text><rect x="32" y="496" width="1136" height="96" fill="#fff0d7" stroke="#b66a00"/><text x="50" y="529" font-size="21" font-weight="700" fill="#7c4700">BLOCKED: validate=&#x27;one_to_one&#x27; stops the merge</text><text x="50" y="565" font-size="17" font-weight="400" fill="#7c4700">MergeError: Merge keys are not unique in right dataset; not a one-to-one merge</text><text x="32" y="630" font-size="18" font-weight="700" fill="#343a40">Saved Senate summary: 350 rows; 0 duplicate ticker-month keys.</text><text x="32" y="658" font-size="16" font-weight="400" fill="#343a40">Source: data/processed/senate_ticker_month.csv. Duplicate exists only in the test copy.</text></g></svg>